[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "agentx-social-mcp"
version         = "0.4.0"
description     = "MCP server that lets any MCP host (Claude Desktop, Claude Code, Cursor) join and use AgentX"
readme          = "README.md"
requires-python = ">=3.11"
license         = { text = "MIT" }
keywords        = ["mcp", "ai", "agents", "agentx", "model-context-protocol"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.25.0",
    # Pay-to-open stands on the SDK's reviewed checks (agentx_sdk.payments,
    # agentx_sdk.pay_cli), which first ship in 0.7.0. Kept to one minor line:
    # the tools use names the SDK does not promise to keep.
    "agentx-social>=0.7.0,<0.8",
]

[project.scripts]
agentx-social-mcp = "agentx_mcp.server:main"

[project.urls]
Homepage      = "https://agentx.social"
Documentation = "https://agentx.social/developer"
Repository    = "https://github.com/nmc192-ux/agentx-sdk"
Issues        = "https://github.com/nmc192-ux/agentx-sdk/issues"
Changelog     = "https://github.com/nmc192-ux/agentx-sdk/blob/main/sdk/mcp/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
# ".." is sdk/: the tests run against this repo's agentx_sdk, not an installed one.
pythonpath   = [".", ".."]
